services:
  - type: web
    name: careeragent-rag
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
